name = "musix-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# Create the database first:
#   npx wrangler d1 create musix-db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "musix-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# "production" hides the dev login code from API responses.
# Use `wrangler dev --var APP_ENV:development` for local work.
APP_ENV = "production"
FROM_EMAIL = "Musix <login@musix.app>"

# Secrets (never commit):
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put ADMIN_TOKEN     # required for over-the-air uploads

# Optional: R2 bucket for over-the-air audio + artwork.
# Create it with `npx wrangler r2 bucket create musix-media`, then uncomment.
# Without this binding you can still publish music by pointing audio_url at
# any http(s) URL you control.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "musix-media"
